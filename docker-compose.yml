services:
  db:
    image: postgres:17@sha256:0b657ff48d7f76a1e907f381b1693eb4f2bf54c1d2df4feb6743d7dc601768dd
    restart: unless-stopped
    environment:
      POSTGRES_DB: xitcoin_blockscout
      POSTGRES_USER: xitcoin_blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - blockscout_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xitcoin_blockscout -d xitcoin_blockscout"]
      interval: 10s
      timeout: 5s
      retries: 18

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - blockscout_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18

  backend:
    image: ghcr.io/xitcoin-org/blockscout-backend:v11.2.7@sha256:ec76d243778910c84c786e0fba1aa386c12091b83e395e15b52464527057a55a
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start
    environment:
      DATABASE_URL: postgresql://xitcoin_blockscout:${POSTGRES_PASSWORD}@db:5432/xitcoin_blockscout
      ECTO_USE_SSL: "false"
      ECTO_SSL_MODE: disable
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_TRANSPORT: http
      ETHEREUM_JSONRPC_HTTP_URL: https://evm-rpc-testnet.xitcoin.org
      CHAIN_ID: "101089"
      NETWORK: Xitcoin
      SUBNETWORK: Testnet
      BLOCKSCOUT_HOST: evm-explorer-testnet.xitcoin.org
      BLOCKSCOUT_PROTOCOL: https
      REDIS_URL: redis://redis:6379
      INDEXER_BLOCK_RANGE: "1000"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      DISABLE_EXCHANGE_RATES: "false"
      POOL_SIZE: "20"
      POOL_SIZE_API: "20"
      MARKET_COINGECKO_COIN_ID: "xitcoin"
      MARKET_HISTORY_FETCHER_ENABLED: "false"
    ports:
      - "127.0.0.1:14000:4000"

volumes:
  blockscout_db:
  blockscout_redis:
